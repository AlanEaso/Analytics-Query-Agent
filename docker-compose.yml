version: '3.8'

services:
  csm_agent:
    build: .
    volumes:
      - ./chroma_storage:/app/chroma_storage
    networks:
      - csm_network
    ports:
      - "8000:8000"  # If you plan to add API endpoints later
    env_file:
      - .env
    depends_on:
      - mongodb
    environment:
      - PYTHONUNBUFFERED=1
      - MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/
    stdin_open: true  # Keep STDIN open for interactive CLI
    tty: true        # Allocate a pseudo-TTY

  mongodb:
    image: mongo:latest
    env_file: .env
    networks:
      - csm_network
    ports:
      - "27017:27017"
    volumes:
      - ./mongodata:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

  slack_notifier:
    build: 
      context: ./slack_notifier
    networks:
      - csm_network
    ports:
      - "3000:3000"
    env_file:
      - .env

networks:
  csm_network:
    driver: bridge

volumes:
  mongodata: